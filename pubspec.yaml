issue_tracker: https://github.com/MelakuDemeke/kenat-dart/issues

topics:
  - calendar
  - ethiopian
  - date
  - localization

environment:
  sdk: ">=3.0.0 <4.0.0"

dev_dependencies:
  test: ^1.24.0
  lints: ^3.0.0
